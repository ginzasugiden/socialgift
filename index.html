<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ソーシャルギフト設定侍</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #fdf2f8;
    --surface: #ffffff;
    --surface-hover: #fce4ec;
    --border: #f9a8d4;
    --border-focus: #db2777;
    --text: #4a1942;
    --text-muted: #9d6b8a;
    --accent: #db2777;
    --accent-glow: rgba(219,39,119,0.18);
    --success: #16a34a;
    --success-bg: rgba(22,163,74,0.1);
    --error: #dc2626;
    --error-bg: rgba(220,38,38,0.08);
    --warning: #ea580c;
    --warning-bg: rgba(234,88,12,0.08);
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Header ─── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .dev-badge {
    margin-left: auto;
    background: var(--error);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 6px;
    letter-spacing: 0.6px;
    font-family: var(--mono);
    box-shadow: 0 2px 8px rgba(220,38,38,0.35);
    user-select: none;
  }
  .header-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #db2777, #f472b6);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header h1 {
    font-size: 16px; font-weight: 600;
    color: var(--text);
  }
  .header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono);
    margin-top: 1px;
  }

  /* ─── Main Layout ─── */
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 24px;
  }

  /* ─── Credentials Panel ─── */
  /* ─── Auth Panel ─── */
  .auth-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 20px;
    transition: border-color .3s;
  }
  .auth-panel.authed { border-color: var(--success); }

  /* ── Not logged in: login form ── */
  .login-form { display: block; }
  .login-form .login-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .login-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .login-fields label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
    display: block;
  }
  .login-fields input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }
  .login-fields input:focus { border-color: var(--border-focus); }
  .login-fields input.err { border-color: var(--error); }
  .login-actions {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .login-error {
    font-size: 12px;
    color: var(--error);
    margin-top: 8px;
    min-height: 16px;
    font-family: var(--mono);
  }

  /* ── Logged in: user info bar ── */
  .user-info { display: none; }
  .user-info-inner {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #db2777, #f472b6);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .user-details { flex: 1; min-width: 0; }
  .user-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .user-meta {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono);
    margin-top: 1px;
  }
  .user-meta .expiry-ok { color: var(--success); }
  .user-meta .expiry-warn { color: var(--warning); }
  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 7px;
    padding: 5px 12px;
    font-size: 11px;
    font-family: var(--sans);
    cursor: pointer;
    transition: all .2s;
    flex-shrink: 0;
  }
  .btn-logout:hover { border-color: var(--error); color: var(--error); }

  /* ─── Search Mode Tabs ─── */
  .search-tabs {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 10px;
    gap: 2px;
  }
  .search-tab {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .search-tab.active {
    background: var(--accent);
    color: #fff;
  }
  .search-tab:hover:not(.active) {
    background: var(--surface-hover);
    color: var(--text);
  }

  /* ─── Search Bar ─── */
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .search-wrap {
    flex: 1;
    position: relative;
  }
  .search-wrap .icon-search {
    position: absolute; left: 13px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 16px;
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px 11px 40px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-wrap input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .search-wrap input::placeholder { color: var(--text-muted); }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 22px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: #be185d; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border); }

  /* ─── Results Header ─── */
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    min-height: 32px;
  }
  .results-count {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono);
  }
  .results-count span { color: var(--accent); font-weight: 600; }
  .batch-actions {
    display: flex;
    gap: 8px;
  }
  .btn-sm {
    padding: 6px 14px;
    font-size: 12px;
    border-radius: 7px;
  }

  /* ─── Load More ─── */
  .load-more-wrap {
    margin-top: 14px;
    text-align: center;
    padding-bottom: 8px;
  }
  .load-more-info {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono);
    margin-bottom: 8px;
  }

  /* ─── Item List ─── */
  .item-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color .2s, background .2s;
    animation: slideIn .25s ease both;
  }
  .item-card:hover { border-color: var(--border-focus); background: var(--surface-hover); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Checkbox Toggle */
  .toggle-wrap {
    position: relative;
    width: 46px; height: 26px;
    flex-shrink: 0;
  }
  .toggle-wrap input {
    opacity: 0; width: 0; height: 0;
  }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: #e9d5e0;
    border-radius: 13px;
    cursor: pointer;
    transition: background .25s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .25s;
  }
  .toggle-wrap input:checked + .toggle-slider { background: var(--accent); }
  .toggle-wrap input:checked + .toggle-slider::before { transform: translateX(20px); }
  .toggle-wrap input:focus + .toggle-slider { box-shadow: 0 0 0 3px var(--accent-glow); }

  /* Item info */
  .item-info { flex: 1; min-width: 0; }
  .item-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-manage {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono);
    margin-top: 2px;
  }

  /* Status badge */
  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.3px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-on { background: var(--accent-glow); color: var(--accent); }
  .badge-off { background: rgba(157,107,138,0.1); color: var(--text-muted); }
  .badge-pending { background: var(--warning-bg); color: var(--warning); }

  /* ─── Action Bar (fixed bottom) ─── */
  .action-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(253,242,248,0.92);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.22,1,.36,1);
    z-index: 200;
  }
  .action-bar.visible { transform: translateY(0); }
  .action-bar .change-info {
    font-size: 13px;
    color: var(--text-muted);
  }
  .action-bar .change-info strong { color: var(--warning); }

  /* ─── Log Panel ─── */
  .log-panel {
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .log-header {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-body {
    padding: 14px 18px;
    font-family: var(--mono);
    font-size: 11px;
    max-height: 200px;
    overflow-y: auto;
    color: var(--text-muted);
  }
  .log-entry {
    padding: 4px 0;
    border-bottom: 1px solid rgba(219,39,119,0.1);
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-time { color: #9d6b8a; flex-shrink: 0; }
  .log-ok { color: var(--success); }
  .log-err { color: var(--error); }
  .log-info { color: var(--accent); }

  /* ─── Empty / Loading States ─── */
  .state-msg {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .state-msg .emoji { font-size: 32px; margin-bottom: 10px; }
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    top: 24px; right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text);
    box-shadow: 0 8px 32px rgba(219,39,119,0.12);
    z-index: 300;
    transform: translateX(calc(100% + 40px));
    transition: transform .35s cubic-bezier(.22,1,.36,1);
    max-width: 340px;
  }
  .toast.show { transform: translateX(0); }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--error); }
  .toast .toast-title { font-weight: 600; margin-bottom: 2px; }
  .toast.success .toast-title { color: var(--success); }
  .toast.error .toast-title { color: var(--error); }
  .toast .toast-body { color: var(--text-muted); font-size: 12px; }
</style>
<script src="config.js"></script>
</head>
<body>

<!-- Header -->
<div class="header">
   <div class="header-icon">🎁</div>
  <div>
    <h1>ソーシャルギフト設定侍</h1>
    <div class="subtitle">Rakuten ItemAPI 2.0 — features.socialGiftFlag</div>
  </div>
  <div class="dev-badge" id="devBadge" style="display:none;">⚠ DEV モード</div>
</div>

<!-- Main -->
<div class="container">

  <!-- Auth Panel -->
  <div class="auth-panel" id="authPanel">

    <!-- ── ログイン前 ── -->
    <div class="login-form" id="loginForm">
      <div class="login-title">🔐 &nbsp;ログイン</div>
      <div class="login-fields">
        <div>
          <label>ID</label>
          <input type="text"     id="inputId" placeholder="ユーザーID" autocomplete="off">
        </div>
        <div>
          <label>PW</label>
          <input type="password" id="inputPw" placeholder="パスワード" autocomplete="off"
                 onkeydown="if(event.key==='Enter') doLogin()">
        </div>
      </div>
      <div class="login-actions">
        <button class="btn btn-sm" onclick="doLogin()">ログイン</button>
        <span id="loginSpinner" style="display:none;"><span class="spinner"></span></span>
      </div>
      <div class="login-error" id="loginError"></div>
    </div>

    <!-- ── ログイン済み ── -->
    <div class="user-info" id="userInfo">
      <div class="user-info-inner">
        <div class="user-avatar">✓</div>
        <div class="user-details">
          <div class="user-name" id="userName">−</div>
          <div class="user-meta" id="userMeta">−</div>
        </div>
        <button class="btn-logout" onclick="doLogout()">ログアウト</button>
      </div>
    </div>

  </div>

  <!-- Search -->
  <div class="search-tabs" role="tablist">
    <button class="search-tab active" id="tabCode"  role="tab" onclick="switchSearchMode('code')">商品コード</button>
    <button class="search-tab"        id="tabTitle" role="tab" onclick="switchSearchMode('title')">商品名</button>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <span class="icon-search">🔍</span>
      <input type="text" id="searchInput"
             placeholder="商品管理番号（カンマ区切り、完全一致）"
             onkeydown="if(event.key==='Enter') handleSearch()">
    </div>
    <button class="btn" id="btnSearch" onclick="handleSearch()">検索</button>
  </div>

  <!-- Results -->
  <div class="results-header" id="resultsHeader" style="display:none;">
    <div class="results-count">検索結果：<span id="countNum">0</span> 件</div>
    <div class="batch-actions">
      <button class="btn btn-ghost btn-sm" onclick="selectAll(true)">全チェック</button>
      <button class="btn btn-ghost btn-sm" onclick="selectAll(false)">全アンチェック</button>
    </div>
  </div>

  <div id="itemList" class="item-list">
    <div class="state-msg">
      <div class="emoji">🔍</div>
      検索して商品を表示してください
    </div>
  </div>

  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <div class="load-more-info" id="loadMoreInfo"></div>
    <button class="btn btn-ghost btn-sm" id="btnLoadMore" onclick="loadMore()">もっと読み込む</button>
  </div>

  <!-- Log -->
  <div class="log-panel" id="logPanel" style="display:none;">
    <div class="log-header">
      📋 実行ログ
      <button class="btn btn-ghost btn-sm" onclick="clearLog()">クリア</button>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>
</div>

<!-- Action Bar (fixed bottom) -->
<div class="action-bar" id="actionBar">
  <div class="change-info">
    <strong id="changeCount">0</strong> 件の変更があります
  </div>
  <button class="btn" id="btnUpdate" onclick="applyChanges()">変更を適用</button>
  <button class="btn btn-ghost btn-sm" onclick="revertChanges()">元に戻す</button>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-title" id="toastTitle"></div>
  <div class="toast-body" id="toastBody"></div>
</div>

<script>
// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let items = [];           // { manageNumber, title, original, current }
let logs  = [];

// 検索モード ('code' | 'title') と、商品名検索のページング状態
let searchMode  = 'code';
let searchState = {
  mode:     'code',
  query:    '',
  offset:   0,
  numFound: 0,
  hasMore:  false
};

// ページサイズは items.bulk-get の上限 50 と揃える。
const PAGE_SIZE   = 50;
const BULK_GET_MAX = 50;

// PATCH スロットリング（楽天非公開のレート制限への保守的対応）
const PATCH_INTERVAL_MS  = 1500;   // 通常時の間隔
const PATCH_MAX_RETRY    = 3;      // 1リクエストあたりの最大リトライ回数
const PATCH_BACKOFF_BASE = 5000;   // バックオフ起点 5s（5s, 10s, 20s）

// ═══════════════════════════════════════════════════
// CONFIG（config.js から読み込む）
// ═══════════════════════════════════════════════════
// GAS_AUTH_URL・ACCESS_TOKEN は config.js の APP_CONFIG で定義

// ═══════════════════════════════════════════════════
// AUTH STATE
// ═══════════════════════════════════════════════════
let authState = {
  loggedIn:      false,
  licenseKey:    '',
  serviceSecret: '',
  sname:         '',
  expiry:        ''
};

// ── ログイン ──
async function doLogin() {
  const id = document.getElementById('inputId').value.trim();
  const pw = document.getElementById('inputPw').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  document.getElementById('inputId').classList.remove('err');
  document.getElementById('inputPw').classList.remove('err');

  if (!id || !pw) {
    errEl.textContent = 'IDとPWを入力してください';
    if (!id) document.getElementById('inputId').classList.add('err');
    if (!pw) document.getElementById('inputPw').classList.add('err');
    return;
  }

  // スピナー
  document.getElementById('loginSpinner').style.display = 'inline';
  document.getElementById('btnLogin') && (document.querySelector('.login-actions .btn').disabled = true);

  try {
    const url = APP_CONFIG.GAS_AUTH_URL
      + '?token=' + encodeURIComponent(APP_CONFIG.ACCESS_TOKEN)
      + '&id='    + encodeURIComponent(id)
      + '&pw='    + encodeURIComponent(pw);
    const res  = await fetch(url);
    const data = await res.json();

    if (data.ok) {
      // 認証成功 → 状態を保持
      authState = {
        loggedIn:      true,
        licenseKey:    data.licenseKey,
        serviceSecret: data.serviceSecret,
        sname:         data.sname,
        expiry:        data.expiry
      };
      renderAuthUI();
      addLog('info', `ログイン成功: ${data.sname}`);
    } else {
      errEl.textContent = data.error || '認証に失敗しました';
      document.getElementById('inputPw').classList.add('err');
      document.getElementById('inputPw').value = '';
      document.getElementById('inputPw').focus();
    }
  } catch (e) {
    errEl.textContent = 'サーバーとの通信に失敗しました';
  }

  // スピナーOFF
  document.getElementById('loginSpinner').style.display = 'none';
  document.querySelector('.login-actions .btn').disabled = false;
}

// ── ログアウト ──
function doLogout() {
  authState = { loggedIn: false, licenseKey: '', serviceSecret: '', sname: '', expiry: '' };
  document.getElementById('inputId').value = '';
  document.getElementById('inputPw').value = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('authPanel').classList.remove('authed');
  renderAuthUI();
  // 商品一覧もリセット
  items = [];
  searchState = { mode: searchMode, query: '', offset: 0, numFound: 0, hasMore: false };
  document.getElementById('itemList').innerHTML =
    '<div class="state-msg"><div class="emoji">🔍</div>検索して商品を表示してください</div>';
  document.getElementById('resultsHeader').style.display = 'none';
  document.getElementById('loadMoreWrap').style.display  = 'none';
  updateActionBar();
}

// ── UI 切り替え ──
function renderAuthUI() {
  const loginForm = document.getElementById('loginForm');
  const userInfo  = document.getElementById('userInfo');
  const panel     = document.getElementById('authPanel');

  if (authState.loggedIn) {
    loginForm.style.display = 'none';
    userInfo.style.display  = 'block';
    panel.classList.add('authed');

    document.getElementById('userName').textContent = authState.sname || 'Unknown';

    // expiry 表示
    let metaHtml = '';
    if (authState.expiry) {
      const exp   = new Date(authState.expiry);
      const now   = new Date();
      const days  = Math.ceil((exp - now) / (1000*60*60*24));
      const cls   = days <= 7 ? 'expiry-warn' : 'expiry-ok';
      const label = days <= 0 ? '期限切れ' : `残り ${days} 日`;
      metaHtml = `期限: <span class="${cls}">${label}</span>`;
    }
    document.getElementById('userMeta').innerHTML = metaHtml;
  } else {
    loginForm.style.display = 'block';
    userInfo.style.display  = 'none';
  }
}

// ═══════════════════════════════════════════════════
// API CALLS（GASプロキシ経由）
// ═══════════════════════════════════════════════════

function gasUrl(extraParams) {
  const params = [
    'token=' + encodeURIComponent(APP_CONFIG.ACCESS_TOKEN),
    'ss='    + encodeURIComponent(authState.serviceSecret),
    'lk='    + encodeURIComponent(authState.licenseKey),
  ];
  for (const [k, v] of Object.entries(extraParams)) {
    params.push(k + '=' + encodeURIComponent(v));
  }
  return APP_CONFIG.GAS_AUTH_URL + '?' + params.join('&');
}

// ── items.search プロキシ ──
//   field: 'title' | 'mn'
async function apiSearch(field, query, hits, offset) {
  const url = gasUrl({ action: 'search', field, q: query, hits, offset });
  const res = await fetch(url);
  return res.json();
}

// ── items.bulk-get プロキシ（最大50件） ──
async function apiBulkGet(manageNumbers) {
  const url = gasUrl({ action: 'bulkget', mns: manageNumbers.join(',') });
  const res = await fetch(url);
  return res.json();
}

// ── items.patch プロキシ（1件） ──
async function apiPatch(manageNumber, socialGiftFlag) {
  const url = gasUrl({
    action: 'patch',
    mn: manageNumber,
    sgf: socialGiftFlag ? 'true' : 'false'
  });
  const res = await fetch(url);
  return res.json();
}

// ── ユーティリティ ──
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// レート制限とみなす条件
function isRateLimited(result) {
  if (result && result.ok) return false;
  if (result?.status === 429 || result?.status === 503) return true;
  const msgs = [
    result?.error || '',
    result?.data?.errors?.[0]?.message || '',
    result?.data?.errors?.[0]?.code    || ''
  ].join(' ');
  return /rate|limit|too many|上限|限度|回数/i.test(msgs);
}

// ═══════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════

// ── タブ切替 ──
function switchSearchMode(mode) {
  searchMode = mode;
  document.getElementById('tabCode').classList.toggle('active',  mode === 'code');
  document.getElementById('tabTitle').classList.toggle('active', mode === 'title');
  const input = document.getElementById('searchInput');
  if (mode === 'code') {
    input.placeholder = '商品管理番号（カンマ区切り、完全一致）';
  } else {
    input.placeholder = '商品名（部分一致）';
  }
  input.focus();
}

async function handleSearch() {
  if (!authState.loggedIn) {
    showToast('ログインが必要です', 'まず認証パネルでログインしてください', 'error');
    return;
  }

  const query = document.getElementById('searchInput').value.trim();
  const list  = document.getElementById('itemList');

  list.innerHTML = '<div class="state-msg"><span class="spinner"></span> 検索中…</div>';
  document.getElementById('resultsHeader').style.display = 'none';
  document.getElementById('loadMoreWrap').style.display  = 'none';

  if (query === '') {
    list.innerHTML = `
      <div class="state-msg">
        <div class="emoji">💡</div>
        <strong>検索キーワードを入力してください</strong><br>
        <span style="font-size:12px; color:var(--text-muted); margin-top:4px; display:inline-block;">
          ${searchMode === 'code'
            ? '商品管理番号をカンマ区切りで入力（例：<code style="color:var(--accent)">item001,item002</code>）'
            : '商品名の一部を入力（部分一致で検索します）'}
        </span>
      </div>`;
    return;
  }

  items = [];
  searchState = { mode: searchMode, query, offset: 0, numFound: 0, hasMore: false };

  if (searchMode === 'code') {
    // コードモード: search を経由せず bulk-get に直行
    const allMns = query.split(',').map(s => s.trim()).filter(Boolean);
    searchState.numFound = allMns.length;
    await fetchByBulkGet(allMns);
  } else {
    // 商品名モード: search → bulk-get
    await fetchByTitle();
  }

  renderList();
  renderLoadMore();
}

// ── bulk-get でまとめて取得（50件ずつバッチ）──
async function fetchByBulkGet(manageNumbers) {
  for (let i = 0; i < manageNumbers.length; i += BULK_GET_MAX) {
    const batch = manageNumbers.slice(i, i + BULK_GET_MAX);
    try {
      const result = await apiBulkGet(batch);
      if (result.ok && result.data?.items) {
        for (const it of result.data.items) {
          const flag = it.features?.socialGiftFlag ?? false;
          items.push({
            manageNumber: it.manageNumber,
            title:        it.title || '(商品名なし)',
            original:     flag,
            current:      flag
          });
        }
        addLog('info', `BULK-GET ${batch.length} 件 → ${result.data.items.length} 件取得`);
        // バッチ間で取得できなかった mn を警告
        const got = new Set(result.data.items.map(x => x.manageNumber));
        const missing = batch.filter(x => !got.has(x));
        if (missing.length) {
          addLog('err', `見つからなかった商品: ${missing.join(', ')}`);
        }
      } else {
        const errMsg = result.data?.errors?.[0]?.message || result.error || 'エラー';
        addLog('err', `BULK-GET 失敗 → ${result.status || ''} ${errMsg}`);
      }
    } catch (e) {
      addLog('err', `BULK-GET → ネットワークエラー (${e.message || e})`);
    }
  }
}

// ── 商品名検索: search で manageNumber 群を取り、bulk-get で本体取得 ──
async function fetchByTitle() {
  let searchRes;
  try {
    searchRes = await apiSearch('title', searchState.query, PAGE_SIZE, searchState.offset);
  } catch (e) {
    addLog('err', `SEARCH → ネットワークエラー (${e.message || e})`);
    return;
  }
  if (!searchRes.ok) {
    const errMsg = searchRes.data?.errors?.[0]?.message || searchRes.error || 'エラー';
    addLog('err', `SEARCH 失敗 → ${searchRes.status || ''} ${errMsg}`);
    return;
  }
  const data = searchRes.data || {};
  const mns  = Array.isArray(data.manageNumbers) ? data.manageNumbers : [];
  searchState.numFound = data.numFound ?? mns.length;
  searchState.offset  += mns.length;
  searchState.hasMore  = mns.length > 0
                         && searchState.offset < searchState.numFound
                         && searchState.offset < 9999;

  addLog('info', `SEARCH "${searchState.query}" → ${mns.length} 件 / 全 ${searchState.numFound} 件`);

  if (mns.length > 0) {
    await fetchByBulkGet(mns);
  }
}

// ── 「もっと読み込む」: title モード時のみ有効 ──
async function loadMore() {
  if (!searchState.hasMore) return;
  const btn = document.getElementById('btnLoadMore');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 読み込み中…';
  await fetchByTitle();
  renderList();
  renderLoadMore();
  btn.disabled = false;
  btn.innerHTML = 'もっと読み込む';
}

function renderLoadMore() {
  const wrap = document.getElementById('loadMoreWrap');
  const info = document.getElementById('loadMoreInfo');
  const btn  = document.getElementById('btnLoadMore');
  if (searchState.mode === 'title' && searchState.numFound > 0) {
    wrap.style.display = 'block';
    info.textContent = `${items.length} / ${searchState.numFound} 件 表示中`;
    btn.style.display = searchState.hasMore ? 'inline-flex' : 'none';
  } else {
    wrap.style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function renderList() {
  const list = document.getElementById('itemList');
  document.getElementById('resultsHeader').style.display = 'flex';
  document.getElementById('countNum').textContent = items.length;

  if (items.length === 0) {
    list.innerHTML = '<div class="state-msg"><div class="emoji">📭</div>該当する商品が見つかりませんでした</div>';
    return;
  }

  list.innerHTML = items.map((item, i) => `
    <div class="item-card" style="animation-delay:${i * 0.04}s">
      <div class="toggle-wrap">
        <input type="checkbox" id="chk_${i}" ${item.current ? 'checked' : ''}
               onchange="toggleItem(${i})">
        <label class="toggle-slider" for="chk_${i}"></label>
      </div>
      <div class="item-info">
        <div class="item-title">${escHtml(item.title)}</div>
        <div class="item-manage">${escHtml(item.manageNumber)}</div>
      </div>
      <span class="badge ${item.current ? 'badge-on' : 'badge-off'}" id="badge_${i}">
        ${item.current ? '対応する' : '対応しない'}
      </span>
      ${item.current !== item.original
        ? `<span class="badge badge-pending" id="pending_${i}">変更待ち</span>`
        : `<span style="width:50px" id="pending_${i}"></span>`}
    </div>
  `).join('');

  updateActionBar();
}

function toggleItem(idx) {
  items[idx].current = document.getElementById(`chk_${idx}`).checked;
  // badge update
  const badge = document.getElementById(`badge_${idx}`);
  badge.className = 'badge ' + (items[idx].current ? 'badge-on' : 'badge-off');
  badge.textContent = items[idx].current ? '対応する' : '対応しない';
  // pending badge
  const pending = document.getElementById(`pending_${idx}`);
  if (items[idx].current !== items[idx].original) {
    pending.className = 'badge badge-pending';
    pending.textContent = '変更待ち';
  } else {
    pending.className = '';
    pending.textContent = '';
    pending.style.width = '50px';
  }
  updateActionBar();
}

function selectAll(val) {
  items.forEach((item, i) => {
    item.current = val;
    document.getElementById(`chk_${i}`).checked = val;
  });
  renderList();
}

// ═══════════════════════════════════════════════════
// ACTION BAR
// ═══════════════════════════════════════════════════
function updateActionBar() {
  const changes = items.filter(it => it.current !== it.original).length;
  document.getElementById('changeCount').textContent = changes;
  const bar = document.getElementById('actionBar');
  bar.classList.toggle('visible', changes > 0);
}

function revertChanges() {
  items.forEach(it => { it.current = it.original; });
  renderList();
}

// ═══════════════════════════════════════════════════
// APPLY (PATCH) — スロットリング + 自動リトライ
// ═══════════════════════════════════════════════════
async function applyChanges() {
  if (!authState.loggedIn) {
    showToast('ログインが必要です', 'まず認証パネルでログインしてください', 'error');
    return;
  }

  const toUpdate = items.filter(it => it.current !== it.original);
  if (toUpdate.length === 0) return;

  if (APP_CONFIG.MODE === 'dev') {
    const ok = confirm(`【DEV モード】${toUpdate.length} 件の socialGiftFlag を更新します。\n本番ではなく dev 環境に対する操作であることを確認してください。\n続行しますか？`);
    if (!ok) return;
  }

  const btn = document.getElementById('btnUpdate');
  const total = toUpdate.length;
  btn.disabled = true;

  // 「元に戻す」ボタンも処理中は無効化
  const revertBtn = document.querySelector('.action-bar .btn-ghost');
  if (revertBtn) revertBtn.disabled = true;

  const setProgress = (done, note) => {
    btn.innerHTML = `<span class="spinner"></span> 更新中… ${done}/${total}${note ? ` (${note})` : ''}`;
  };
  setProgress(0);

  let success = 0, fail = 0;

  for (let i = 0; i < toUpdate.length; i++) {
    const item = toUpdate[i];
    let lastErr = null;
    let done = false;

    for (let attempt = 0; attempt <= PATCH_MAX_RETRY; attempt++) {
      let result;
      try {
        result = await apiPatch(item.manageNumber, item.current);
      } catch (e) {
        lastErr = `ネットワークエラー (${e.message || e})`;
        break;
      }

      if (result.ok) {
        item.original = item.current;
        success++;
        addLog('ok', `PATCH ${item.manageNumber} → socialGiftFlag: ${item.current}${attempt > 0 ? ` (リトライ${attempt}回)` : ''}`);
        done = true;
        break;
      }

      // レート制限なら指数バックオフ後リトライ
      if (isRateLimited(result) && attempt < PATCH_MAX_RETRY) {
        const wait = PATCH_BACKOFF_BASE * Math.pow(2, attempt);  // 5s, 10s, 20s
        addLog('info', `PATCH ${item.manageNumber} → レート制限を検出、${wait/1000}s 待機後にリトライ (${attempt + 1}/${PATCH_MAX_RETRY})`);
        setProgress(success + fail, `待機 ${wait/1000}s`);
        await sleep(wait);
        continue;
      }

      lastErr = (result.data?.errors?.[0]?.message || result.error || 'エラー');
      addLog('err', `PATCH ${item.manageNumber} → ${result.status || ''} ${lastErr}`);
      break;
    }

    if (!done) {
      fail++;
      if (lastErr && !lastErr.includes('PATCH')) {
        // 上で addLog 済みのケースを除き、ネットワークエラー等を記録
        if (lastErr.includes('ネットワーク')) {
          addLog('err', `PATCH ${item.manageNumber} → ${lastErr}`);
        }
      }
    }

    setProgress(success + fail);

    // 次のリクエストとの間隔（最後の1件は待機不要）
    if (i < toUpdate.length - 1) {
      await sleep(PATCH_INTERVAL_MS);
    }
  }

  btn.disabled = false;
  btn.innerHTML = '変更を適用';
  if (revertBtn) revertBtn.disabled = false;
  renderList();

  if (fail === 0) {
    showToast('更新完了', `${success} 件のソーシャルギフト設定が更新されました`, 'success');
  } else {
    showToast('一部失敗', `成功: ${success} 件 / 失敗: ${fail} 件。ログを確認してください`, 'error');
  }
}

// ═══════════════════════════════════════════════════
// LOG
// ═══════════════════════════════════════════════════
function addLog(type, msg) {
  const now = new Date();
  const time = now.toLocaleTimeString('ja-JP', { hour12: false });
  logs.unshift({ type, time, msg });
  renderLog();
}

function renderLog() {
  const panel = document.getElementById('logPanel');
  const body  = document.getElementById('logBody');
  panel.style.display = 'block';
  body.innerHTML = logs.map(l => `
    <div class="log-entry">
      <span class="log-time">${l.time}</span>
      <span class="log-${l.type}">${escHtml(l.msg)}</span>
    </div>
  `).join('');
}

function clearLog() {
  logs = [];
  document.getElementById('logPanel').style.display = 'none';
}

// ═══════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════
let toastTimer;
function showToast(title, body, type) {
  const t = document.getElementById('toast');
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastBody').textContent = body;
  t.className = 'toast ' + type;
  // force reflow
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ═══════════════════════════════════════════════════
// UTIL
// ═══════════════════════════════════════════════════
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════
// DEV MODE INIT
// ═══════════════════════════════════════════════════
(function initDevModeUI() {
  if (APP_CONFIG.MODE !== 'dev') return;

    favicon.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>";
  }
  const badge = document.getElementById('devBadge');
  if (badge) badge.style.display = 'inline-block';
})();
